<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #1976d2;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #1976d2;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1565c0;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .feedback-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .feedback-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .feedback-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .feedback-rating {
            background: #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .feedback-email {
            color: #1976d2;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .feedback-message {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .feedback-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .login {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .login h1 {
            margin-bottom: 20px;
        }

        .login input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .login button {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <form id="loginForm" class="login hidden">
        <h1>Admin Sign In</h1>
        <label for="tokenInput">Admin token</label>
        <input type="password" id="tokenInput" required autocomplete="current-password">
        <div id="loginError" class="error hidden"></div>
        <button type="submit">Sign in</button>
    </form>

    <div id="dashboard" class="hidden">
    <div class="header">
        <h1> Feedback Dashboard</h1>
        <p>Monitor and manage customer feedback</p>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Feedbacks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgRating">0.0</div>
                <div class="stat-label">Average Rating</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="loadFeedbacks()">🔄 Refresh</button>
        <button onclick="exportCSV()">📥 Export CSV</button>
        <button onclick="signOut()">Sign out</button>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        Loading feedbacks...
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="feedbackGrid" class="feedback-grid"></div>
    </div>

    <script>
        // REPLACE with your API Gateway URL
        const API_URL = 'https://qorp0jyrl2.execute-api.us-east-1.amazonaws.com/feedback';

        const TOKEN_KEY = 'feedbackAdminToken';

        let allFeedbacks = [];
        let refreshTimer = null;

        // sessionStorage can throw (e.g. blocked storage), so guard every access
        function getToken() {
            try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; }
        }

        function setToken(token) {
            try {
                if (token) sessionStorage.setItem(TOKEN_KEY, token);
                else sessionStorage.removeItem(TOKEN_KEY);
            } catch { /* token just won't survive a reload */ }
        }

        function showLogin(message) {
            clearInterval(refreshTimer);
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            const loginError = document.getElementById('loginError');
            loginError.textContent = message || '';
            loginError.classList.toggle('hidden', !message);
        }

        function showDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadFeedbacks();
            // Auto-refresh every 30 seconds
            clearInterval(refreshTimer);
            refreshTimer = setInterval(loadFeedbacks, 30000);
        }

        function signOut() {
            setToken(null);
            allFeedbacks = [];
            document.getElementById('feedbackGrid').innerHTML = '';
            showLogin();
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('tokenInput');
            setToken(input.value.trim());
            input.value = '';
            showDashboard();
        });

        async function loadFeedbacks() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const grid = document.getElementById('feedbackGrid');

            loading.style.display = 'block';
            error.style.display = 'none';
            grid.innerHTML = '';

            try {
                const response = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });

                if (response.status === 401) {
                    setToken(null);
                    showLogin('That token was not accepted. Please try again.');
                    return;
                }

                const data = await response.json();

                if (response.ok) {
                    allFeedbacks = data.feedbacks || [];
                    displayFeedbacks(allFeedbacks);
                    updateStats(allFeedbacks);
                } else {
                    throw new Error(data.message || 'Failed to load feedbacks');
                }
            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
                console.error('Error loading feedbacks:', err);
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayFeedbacks(feedbacks) {
            const grid = document.getElementById('feedbackGrid');

            if (feedbacks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No feedback yet</h3>
                        <p>Feedbacks will appear here once submitted</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = feedbacks.map(fb => `
                <div class="feedback-card">
                    <div class="feedback-header">
                        <div class="feedback-name">${escapeHtml(fb.name)}</div>
                        <div class="feedback-rating">${fb.rating}/5 </div>
                    </div>
                    <div class="feedback-email">${escapeHtml(fb.email)}</div>
                    <div class="feedback-message">${escapeHtml(fb.message)}</div>
                    <div class="feedback-meta">
                        <span>ID: ${fb.feedbackId.substring(0, 8)}...</span>
                        <span>${formatDate(fb.timestamp)}</span>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(feedbacks) {
            document.getElementById('totalCount').textContent = feedbacks.length;

            if (feedbacks.length > 0) {
                const avgRating = feedbacks.reduce((sum, fb) => sum + parseInt(fb.rating || 0), 0) / feedbacks.length;
                document.getElementById('avgRating').textContent = avgRating.toFixed(1);
            } else {
                document.getElementById('avgRating').textContent = '0.0';
            }
        }

        function exportCSV() {
            if (allFeedbacks.length === 0) {
                alert('No feedbacks to export');
                return;
            }

            const headers = ['Name', 'Email', 'Rating', 'Message', 'Timestamp', 'Feedback ID'];
            const rows = allFeedbacks.map(fb => [
                fb.name,
                fb.email,
                fb.rating,
                fb.message,
                fb.timestamp,
                fb.feedbackId
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(csvField).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `feedbacks_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function csvField(value) {
            let text = String(value ?? '');
            // Stop spreadsheets from running submitted text as a formula
            if (/^[=+\-@\t\r]/.test(text)) {
                text = "'" + text;
            }
            // Double any quotes, then wrap the field in quotes
            return `"${text.replace(/"/g, '""')}"`;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start on the dashboard if already signed in this session
        if (getToken()) {
            showDashboard();
        } else {
            showLogin();
        }
    </script>
</body>
</html>

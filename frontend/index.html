<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Collector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Feedback Collector</h1>
        <p class="subtitle">We value your feedback! Please share your thoughts below.</p>

        <form id="feedbackForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Your email address">
            </div>

            <fieldset class="form-group">
                <legend>Rating:</legend>
                <div class="rating">
                    <input type="radio" id="rating5" name="rating" value="5" required>
                    <label for="rating5" title="5 stars">★</label>
                    <input type="radio" id="rating4" name="rating" value="4">
                    <label for="rating4" title="4 stars">★</label>
                    <input type="radio" id="rating3" name="rating" value="3">
                    <label for="rating3" title="3 stars">★</label>
                    <input type="radio" id="rating2" name="rating" value="2">
                    <label for="rating2" title="2 stars">★</label>
                    <input type="radio" id="rating1" name="rating" value="1">
                    <label for="rating1" title="1 star">★</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" required placeholder="Enter your feedback message"></textarea>
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">Submit</span>
                <span id="btnLoader" class="loader hidden"></span>
            </button>
        </form>

        <div id="messageDiv" class="message"></div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>

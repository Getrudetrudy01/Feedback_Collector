AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Feedback Collector - embeddable feedback widget with per-project dashboards

Parameters:
  OwnerToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Secret token for the service owner, who creates projects and can see all of them
  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for owner alerts on projects that opt in (optional; confirm the subscription email)
  NotifyMaxRating:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 5
    Description: Only alert for ratings at or below this (5 = every submission, 2 = only 1-2 star feedback)
  ThrottleRateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second the API accepts (helps against spam floods)
  ThrottleBurstLimit:
    Type: Number
    Default: 20
    Description: Maximum burst of requests the API accepts

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256

Resources:
  # One item per customer project. Holds a hash of the admin key, never the key itself.
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Feedback grouped by project; feedbackId starts with a timestamp, so queries
  # return a project's feedback newest first without scanning other projects.
  ProjectFeedbackTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: feedbackId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        - AttributeName: feedbackId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FeedbackApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit
      # Any site may call the API: the public route checks each project's allowed
      # origins itself, and every other route needs a secret key in a header.
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  FeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          OWNER_TOKEN: !Ref OwnerToken
          SITE_ORIGIN: !GetAtt FrontendBucket.WebsiteURL
          SCREENSHOTS_BUCKET: !Ref ScreenshotsBucket
          PROJECTS_TABLE: !Ref ProjectsTable
          FEEDBACK_TABLE: !Ref ProjectFeedbackTable
          NOTIFY_TOPIC_ARN: !Ref FeedbackTopic
          NOTIFY_MAX_RATING: !Ref NotifyMaxRating
      # Least privilege: only the actions the function uses, on these resources only
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource: !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt ProjectFeedbackTable.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref FeedbackTopic
            # Presigned uploads land in pending/; submitting moves them to screenshots/
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub '${ScreenshotsBucket.Arn}/pending/*'
                - !Sub '${ScreenshotsBucket.Arn}/screenshots/*'
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub '${ScreenshotsBucket.Arn}/pending/*'
      Events:
        CreateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: POST
            Path: /v1/projects
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: GET
            Path: /v1/projects
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: GET
            Path: /v1/projects/{projectId}
        UpdateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: PATCH
            Path: /v1/projects/{projectId}
        RotateProjectKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: POST
            Path: /v1/projects/{projectId}/rotate-key
        CreateScreenshotUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: POST
            Path: /v1/projects/{projectId}/screenshots
        SubmitFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: POST
            Path: /v1/projects/{projectId}/feedback
        ListFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: GET
            Path: /v1/projects/{projectId}/feedback
        UpdateFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeedbackApi
            Method: PATCH
            Path: /v1/projects/{projectId}/feedback/{feedbackId}

  # Owner alerts. The topic always exists (it's free with no subscribers);
  # the email subscription is only created when NotificationEmail is set.
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Feedback Collector

  FeedbackEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # Screenshots attached to feedback. Private: browsers upload with short-lived presigned
  # posts and the dashboard views them with short-lived presigned links.
  ScreenshotsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Customer sites upload directly from the browser
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Uploads that were never attached to submitted feedback
          - Id: DeleteAbandonedUploads
            Status: Enabled
            Prefix: pending/
            ExpirationInDays: 1

  # Static website hosting for the frontend/ folder (hosted form, dashboard, widget.js)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

Outputs:
  ApiUrl:
    Description: Put this in frontend/config.js as apiUrl
    Value: !Sub 'https://${FeedbackApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  WebsiteUrl:
    Description: Hosted form (add ?project=ID) and dashboard (/admin.html)
    Value: !GetAtt FrontendBucket.WebsiteURL
  WidgetUrl:
    Description: Script customers embed on their sites
    Value: !Sub '${FrontendBucket.WebsiteURL}/widget.js'
  FrontendBucketName:
    Description: Upload the frontend/ folder here
    Value: !Ref FrontendBucket
  ScreenshotsBucketName:
    Value: !Ref ScreenshotsBucket
  ProjectsTableName:
    Value: !Ref ProjectsTable
  FeedbackTableName:
    Value: !Ref ProjectFeedbackTable
